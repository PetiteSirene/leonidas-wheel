<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roue Leonidas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
        <div class="leftside">
          <h1>Bienvenue chez Leonidas</h1>
          <p class="text">Communiquez votre courriel pour tenter de gagner un bon d'achat !<br> <br> <br>
            Give your email to try your luck and win a gift card!
          </p>
        </div>
        
        <div class="rightside">
            <button id="spinButton">
                    <div class="pointer" aria-hidden="true"></div>
                    <div class="wheel-shell">
                        <div id="wheel" class="wheel"></div>
                    </div>
                
            </button>
        </div>

    </div>

    <div id="winModal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <h2 id="winTitle">Vous avez gagné</h2>
        <p id="winPrize">Prix</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
