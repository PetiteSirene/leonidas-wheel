<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roue Leonidas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>🎡 Roue Leonidas</h1>

      <div class="wheel-area">
        <div class="pointer" aria-hidden="true"></div>
        <div id="wheel" class="wheel" aria-label="Roue des prix"></div>
      </div>

      <button id="spinButton">Lancer la roue</button>
    </div>

    <div id="winModal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="winTitle">
        <h2 id="winTitle">Gagné</h2>
        <p id="winPrize">Prix</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
