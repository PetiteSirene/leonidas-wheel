<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roue Leonidas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
        <div class="leftside">
          <h1>Bienvenue chez Leonidas</h1>
          <p class="text">Communiquez votre courriel pour tenter de gagner un bon d'achat !<br> <br> <br>
            Give your email to try your luck and win a gift card!
          </p>
        </div>
        
        <div class="rightside">
            <button id="spinButton" type="button">
                    <div class="pointer" aria-hidden="true"></div>
                    <div class="wheel-shell">
                        <div id="wheel" class="wheel"></div>
                    </div>
                
            </button>
        </div>

    </div>

    <div id="winModal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <h2 id="winTitle">Gagné !</h2>
        <p id="winPrize">Prix</p>
      </div>
    </div>

    <script> //Change de css si detect fireTV
      const ua = navigator.userAgent.toLowerCase();
      const isFireTV =
        ua.includes("silk") ||
        ua.includes("fire tv") ||
        ua.includes("aftm") ||
        (window.screen.width >= 1280 && window.screen.height >= 720 && ua.includes("android"));

      if (isFireTV) {
        document.body.classList.add("firetv");

        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "firetv.css";
        document.head.appendChild(link);
      }
    </script>
    <script src="script.js"></script>
  </body>
</html>
